<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  body { margin: 0; font-family: 'Geist Mono'; }
</style>
<script type="importmap">
  {
    "imports": {
      "d3-geo": "/node_modules/d3-geo/src/index.js",
      "d3-array": "/node_modules/d3-array/src/index.js",
      "topojson-client": "/node_modules/topojson-client/src/index.js",
      "internmap": "/node_modules/internmap/src/index.js"
    }
  }
</script>
</head>
<body>
<span style="font-family: 'Geist Mono'">.</span>
<script type="module">
  import * as scenes from './scenes.js'
  window.renderScene = async (name, theme, width, height) => {
    await document.fonts.load('500 16px "Geist Mono"')
    const canvas = document.createElement('canvas')
    canvas.width = width
    canvas.height = height
    await scenes[name](canvas, theme)
    return canvas
  }
  window.exportScene = async (name, theme, width, height, sizes, quality) => {
    const src = await window.renderScene(name, theme, width, height)
    const out = {}
    for (const w of sizes) {
      const c = document.createElement('canvas')
      c.width = w
      c.height = Math.round((height * w) / width)
      const ctx = c.getContext('2d')
      ctx.imageSmoothingQuality = 'high'
      ctx.drawImage(src, 0, 0, c.width, c.height)
      out[w] = c.toDataURL('image/webp', quality)
    }
    return out
  }
  window.ready = true
</script>
</body>
</html>
