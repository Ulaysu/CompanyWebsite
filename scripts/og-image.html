<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #060910; color: #ededeb; font-family: Geist, sans-serif; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(255 255 255 / .045) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / .045) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 80% 90% at 80% 0%, #000 20%, transparent 75%); }
  .glow { position: absolute; width: 700px; height: 400px; right: -150px; top: -220px; background: rgb(92 207 230 / .14); filter: blur(120px); border-radius: 50%; }
  .wrap { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgb(255 255 255 / .14); background: linear-gradient(#1b2333, #0e131e); display: grid; place-items: center; font-family: GeistMono; font-weight: 700; font-size: 18px; position: relative; }
  .mark::after { content: ''; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: #f2803e; }
  .name { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .desc { font-size: 18px; color: #7a869a; margin-top: 4px; }
  h1 { margin-top: auto; font-size: 76px; line-height: 1.02; letter-spacing: -.04em; font-weight: 600; max-width: 960px; background: linear-gradient(180deg, #fff, #b9c2d0); -webkit-background-clip: text; color: transparent; }
  .eyebrow { margin-top: 36px; font-family: GeistMono; font-size: 17px; letter-spacing: .16em; color: #7a869a; text-transform: uppercase; display: flex; gap: 14px; align-items: center; }
  .eyebrow i { width: 28px; height: 1px; background: #f2803e; display: inline-block; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="brand"><div class="mark">SS</div><div><div class="name">Sulayman Sanyang</div><div class="desc">Technology, built from Africa</div></div></div>
    <h1>World-class technology, built from Africa<span style="color:#f2803e;-webkit-text-fill-color:#f2803e">.</span></h1>
    <div class="eyebrow"><i></i>Products · Platforms · Systems — Africa → World</div>
  </div>
</body>
</html>
