<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Serif; font-style: italic; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #f4efe8; font-family: Geist, sans-serif; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(255 255 255 / .04) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / .04) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(ellipse 80% 80% at 20% 20%, #000 15%, transparent 75%); }
  .wrap { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }
  .eyebrow { font-family: GeistMono; font-size: 16px; letter-spacing: .16em; color: #8a857d; text-transform: uppercase; display: flex; gap: 14px; align-items: center; }
  .eyebrow b { color: #f4efe8; font-weight: 500; }
  h1 { margin-top: auto; font-size: 92px; line-height: .96; font-weight: 600; letter-spacing: -.05em; max-width: 1000px; }
  h1 em { font-family: Serif; font-style: italic; font-weight: 400; letter-spacing: -.02em; }
  .foot { margin-top: 44px; padding-top: 22px; border-top: 1px solid rgb(255 255 255 / .12); display: flex; justify-content: space-between; font-family: GeistMono; font-size: 16px; letter-spacing: .04em; color: #8a857d; }
  .foot span:last-child { font-family: Serif; font-style: italic; font-size: 28px; letter-spacing: 0; color: #f4efe8; line-height: 1; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="eyebrow"><svg width="40" height="25" viewBox="0 0 32 20"><circle cx="10" cy="10" r="7.25" fill="none" stroke="#f4efe8" stroke-width="2.5"/><circle cx="22" cy="10" r="7.25" fill="none" stroke="#e8723a" stroke-width="2.5"/><path d="M 15.13 4.87 A 7.25 7.25 0 0 1 17.25 10" fill="none" stroke="#f4efe8" stroke-width="2.5"/></svg><b>SOFORR</b> / Technology company</div>
    <h1>We build technology for ideas <em>worth building.</em></h1>
    <div class="foot"><span>Founded in The Gambia. Building globally.</span><span>Duniyai ka Soforr.</span></div>
  </div>
</body>
</html>
